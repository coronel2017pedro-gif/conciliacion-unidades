[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# La app es de una sola página: cualquier ruta abre index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Que el navegador siempre traiga la versión nueva del HTML (los .js/.css llevan hash en el nombre)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
